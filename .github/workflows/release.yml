# A tag v<semver> on main → tests + leak scan + build + release-check → a GitHub Release with
# module.json and module.zip. Foundry's manifest URL is .../releases/latest/download/module.json, so
# a (non-pre)release is what installs and updates pick up.
#
# workflow_dispatch releases an EXISTING tag by hand, for when a tag's push event didn't start this
# workflow (v0.1.0: the empty public repo's first push). It releases only a v<semver> tag whose commit
# is on main, and never a tag that already has a release, so no tag ever needs deleting and re-pushing.
name: Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to release (v<semver>, its commit on main)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  # One name for the tag in both cases. Always used through this env var, never interpolated into a
  # script, so the input can't inject shell.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: The tag is v<semver>
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' isn't v<semver>"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: git merge-base --is-ancestor "$(git rev-parse "refs/tags/$TAG^{commit}")" origin/main
      - name: No release for this tag yet (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::$TAG already has a release"; exit 1; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run leak-scan -- --history
      - run: npm run build
      - run: node scripts/release-check.mjs "$TAG"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" dist/module.json module.zip \
            --verify-tag --title "The Long Rest $TAG" --notes-file dist/RELEASE_NOTES.md "${pre[@]}"
