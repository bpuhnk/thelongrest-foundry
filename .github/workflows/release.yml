# A tag v<semver> on main → tests + leak scan + build + release-check → a GitHub Release with
# module.json and module.zip. Foundry's manifest URL is .../releases/latest/download/module.json, so
# a (non-pre)release is what installs and updates pick up.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run leak-scan -- --history
      - run: npm run build
      - run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=()
          case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/module.json module.zip \
            --verify-tag --title "The Long Rest $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md "${pre[@]}"
